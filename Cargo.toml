[package]
name = "kiln"
version = "0.1.0"
edition = "2021"
description = "Static recompiler from Horizon OS AArch64 programs to native x86_64"
publish = false

[lib]
name = "kiln"
path = "src/lib.rs"

[[bin]]
name = "kiln"
path = "src/main.rs"

[dependencies]
nx_runtime = { path = "nx_runtime" }
sha2 = "0.10"

[dev-dependencies]
nx_runtime = { path = "nx_runtime", features = ["testing"] }
libloading = "0.8"

[workspace]
members = ["nx_runtime", "nx_gpu", "nx_shader", "nx_vulkan", "kiln_gui"]
default-members = [".", "nx_runtime", "nx_gpu", "nx_shader", "nx_vulkan", "kiln_gui"]

[profile.release]
debug = false
lto = "thin"

[profile.test]
opt-level = 1
