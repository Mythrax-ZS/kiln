[package]
name = "kiln_gui"
version = "0.1.0"
edition = "2021"
description = "A desktop front end for kiln: pick a game, recompile it, run it and keep its settings"
publish = false

[[bin]]
name = "kiln-gui"
path = "src/main.rs"

[dependencies]
eframe = "0.36"
# The games' icons (PNG or JPEG); eframe already builds this crate.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# Only for `examples/brand.rs`, which writes the picture files.
png = "0.18"
