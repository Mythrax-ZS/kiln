[package]
name = "nx_runtime"
version = "0.1.0"
edition = "2021"
description = "Guest CPU model and Horizon OS emulation layer linked into recompiled programs"
publish = false

[lib]
name = "nx_runtime"
path = "src/lib.rs"
crate-type = ["rlib", "staticlib"]

[features]
default = ["vulkan"]
# Test-only helpers (temp dirs, PRNG, A64 assembler) used to build synthetic fixtures.
testing = []
# The Vulkan renderer (`NX_RENDERER=vulkan` at run time). It loads Vulkan when the program first
# draws, so a machine without a driver still runs programs that never do.
vulkan = ["dep:nx_vulkan"]

[dependencies]
nx_gpu = { path = "../nx_gpu" }
nx_vulkan = { path = "../nx_vulkan", optional = true }

[dev-dependencies]
libloading = "0.8"
# Enables the `testing` helpers for this crate's own integration tests.
nx_runtime = { path = ".", features = ["testing"] }
