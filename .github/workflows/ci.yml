name: ci

# The gate of CLAUDE.md (fmt, lint, test) on Windows and on Linux, and the Windows bundle: the
# three files a person needs to recompile a game of their own (kiln-gui.exe, kiln.exe and
# nx_runtime.lib) with a short README and a self-test, tested as a person would get them. Every
# push to `main` that passes is kept as a tag and a pre-release holding that bundle.
#
# What no runner has: a Vulkan device (the renderer's tests print SKIPPED and pass), spirv-val and
# astcenc (the translator's and the ASTC decoder's oracles, the same), and any game: nothing here
# touches game data, and the bundle holds none.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# A newer push to a pull request replaces the run of the older one; a push to `main` is never
# cancelled halfway, because every one of them is saved as a release (see the end of `bundle`).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  # The version the code is developed and linted with: a newer clippy brings new warnings, which
  # should arrive when somebody moves this number, not when a runner's `stable` moves.
  RUST_VERSION: "1.99.0"
  # The Unicorn the differential tests were written against (docs/UNICORN_DISAGREEMENTS.md).
  UNICORN_VERSION: "2.1.4"

jobs:
  windows:
    name: windows (fmt, lint, test)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # A produced program is compiled with clang (and linked with lld against the Windows SDK).
      - name: Find clang
        shell: pwsh
        run: |
          $clang = (Get-Command clang -ErrorAction SilentlyContinue).Source
          if (-not $clang) {
            $known = 'C:\Program Files\LLVM\bin\clang.exe'
            if (Test-Path $known) { $clang = $known }
          }
          if (-not $clang) {
            choco install llvm -y --no-progress
            $clang = 'C:\Program Files\LLVM\bin\clang.exe'
          }
          & $clang --version
          "KILN_CLANG=$clang" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      # The oracle of the instruction tests (a differential test against Unicorn).
      - name: Unicorn
        shell: pwsh
        run: |
          python -m pip install "unicorn==$env:UNICORN_VERSION"
          $dll = python -c "import os, unicorn; print(os.path.join(os.path.dirname(unicorn.__file__), 'lib', 'unicorn.dll'))"
          if (-not (Test-Path $dll)) { throw "unicorn.dll is not at $dll" }
          "UNICORN_DLL=$dll" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: fmt
        run: cargo fmt --all --check

      - name: lint
        run: cargo lint

      - name: test
        run: cargo test

      # The tests that need clang say SKIPPED and pass without it; here it must have been there.
      - name: library tests with the external tools required
        run: cargo test -p kiln --lib
        env:
          KILN_REQUIRE_EXTERNAL: "1"

  linux:
    name: linux (lint, test)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # clang and lld compile and link the produced programs.
      - name: clang and lld
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld
          clang --version

      - name: Unicorn
        run: |
          python3 -m venv "$RUNNER_TEMP/unicorn-venv"
          "$RUNNER_TEMP/unicorn-venv/bin/pip" install "unicorn==$UNICORN_VERSION"
          lib=$(find "$RUNNER_TEMP/unicorn-venv" -name 'libunicorn.so.2' | head -n 1)
          test -n "$lib" || { echo "libunicorn.so.2 was not found"; exit 1; }
          echo "UNICORN_DLL=$lib" >> "$GITHUB_ENV"

      # The desktop front end is built for Windows (see the bundle); the rest of the workspace is
      # what the Linux build is for: the ELF output and the runtime on Linux.
      - name: lint
        run: cargo clippy --workspace --exclude kiln_gui --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace --exclude kiln_gui

      - name: library tests with the external tools required
        run: cargo test -p kiln --lib
        env:
          KILN_REQUIRE_EXTERNAL: "1"

  bundle:
    name: bundle (windows x64)
    needs: windows
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      # To make a tag and a release of the bundle (pushes to `main`, and tags `v*`).
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: bundle

      - name: Find clang
        shell: pwsh
        run: |
          $clang = (Get-Command clang -ErrorAction SilentlyContinue).Source
          if (-not $clang) {
            $known = 'C:\Program Files\LLVM\bin\clang.exe'
            if (Test-Path $known) { $clang = $known }
          }
          if (-not $clang) {
            choco install llvm -y --no-progress
            $clang = 'C:\Program Files\LLVM\bin\clang.exe'
          }
          & $clang --version
          "KILN_CLANG=$clang" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Build (release)
        run: cargo build --release --workspace

      # A tiny synthetic program (no game data), for the self-test that goes in the bundle.
      - name: Make the self-test program
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'selftest-fixture'
          $env:KILN_SELFTEST_FIXTURE = $dir
          cargo test -p kiln --lib -- --ignored --exact build::e2e_tests::writes_the_selftest_program
          if (-not (Test-Path (Join-Path $dir 'exefs\main'))) { throw "the self-test program was not written" }
          "SELFTEST_FIXTURE=$dir" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Bundle
        shell: pwsh
        run: ./tools/bundle.ps1 -Out dist-out -Selftest $env:SELFTEST_FIXTURE

      # The bundle as a person gets it: unpacked somewhere else, on a machine with no Rust (a cargo
      # that does not exist), compiling and running the self-test with the library beside kiln.
      - name: Test the bundle
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist-out -Filter *.zip | Select-Object -First 1
          $where = Join-Path $env:RUNNER_TEMP 'bundle-check'
          Expand-Archive $zip.FullName $where
          $root = Get-ChildItem $where -Directory | Select-Object -First 1
          Get-ChildItem $root.FullName -Recurse | ForEach-Object { $_.FullName.Substring($root.FullName.Length) }
          $env:CARGO = 'C:\does-not-exist\cargo.exe'
          Remove-Item Env:KILN_RUNTIME_LIB -ErrorAction SilentlyContinue
          & "$($root.FullName)\selftest.cmd" /ci
          if ($LASTEXITCODE -ne 0) { throw "the self-test of the bundle failed ($LASTEXITCODE)" }

      - name: Checksums and the name of this build
        id: build
        shell: pwsh
        env:
          SHA: ${{ github.sha }}
          RUN: ${{ github.run_number }}
        run: |
          Get-ChildItem dist-out -Filter *.zip | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Out-File -Encoding ascii dist-out/SHA256SUMS.txt
          Get-Content dist-out/SHA256SUMS.txt
          $short = $env:SHA.Substring(0, 7)
          "short=$short" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          "tag=build-$env:RUN-$short" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT

      # A pull request or a manual run keeps its bundle as an artifact for 30 days; a push to
      # `main` or a tag keeps it in a release instead (artifacts count against the repository's
      # storage allowance, a release does not).
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        with:
          name: kiln-windows-x64
          path: |
            dist-out/*.zip
            dist-out/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      # Every push to `main` that gets this far is kept for good: a tag `build-<run>-<commit>` on
      # that commit and a pre-release (never the "latest" release) holding the bundle. The tag is
      # made by the release, so nothing has to be pushed for it.
      - name: Save the build as a pre-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.build.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Build ${{ github.run_number }} (${{ steps.build.outputs.short }})
          body: |
            The Windows x64 bundle that CI run ${{ github.run_number }} made from commit ${{ github.sha }}
            after the checks passed. Unzip it, read README.txt and run selftest.cmd. It holds no
            game: bring the extracted ExeFS and RomFS of a game of your own.
          files: |
            dist-out/*.zip
            dist-out/SHA256SUMS.txt
          prerelease: true
          make_latest: "false"

      # A version somebody tagged on purpose (`git tag v0.1.0; git push origin v0.1.0`).
      - name: Release a tagged version
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-out/*.zip
            dist-out/SHA256SUMS.txt
          generate_release_notes: true

  bundle-linux:
    name: bundle (linux x86-64, tar.gz and AppImage)
    # After both sets of checks and the Windows bundle, so that the release of a build exists (the
    # Windows bundle made it) before this one adds its files to it; a Windows bundle that failed
    # does not keep the Linux one from being made, a test that failed does.
    needs: [windows, linux, bundle]
    if: ${{ !cancelled() && needs.windows.result == 'success' && needs.linux.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      # To add the files to the tag and the release of the build (pushes to `main`, and tags `v*`).
      contents: write
    env:
      # The tools that make the AppImage, pinned: the release and the checksum of each file.
      APPIMAGETOOL_URL: https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
      APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
      RUNTIME_URL: https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
      RUNTIME_SHA256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: bundle-linux

      # clang and lld compile and link the produced programs; the rest is what building the
      # desktop front end could ask for (it loads X11, Wayland and xkbcommon when it runs, and
      # was built without these installed, but a runner is not the machine that was tried).
      - name: clang, lld and the libraries the front end builds with
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld pkg-config libx11-dev libxkbcommon-dev libwayland-dev
          clang --version

      - name: Build (release)
        run: cargo build --release --workspace

      # A tiny synthetic program (no game data), for the self-test that goes in the bundle.
      - name: Make the self-test program
        run: |
          dir="$RUNNER_TEMP/selftest-fixture"
          KILN_SELFTEST_FIXTURE="$dir" cargo test -p kiln --lib -- --ignored --exact build::e2e_tests::writes_the_selftest_program
          test -f "$dir/exefs/main"
          echo "SELFTEST_FIXTURE=$dir" >> "$GITHUB_ENV"

      - name: The AppImage tools
        run: |
          mkdir -p "$RUNNER_TEMP/appimage"
          cd "$RUNNER_TEMP/appimage"
          curl -fsSL -o appimagetool "$APPIMAGETOOL_URL"
          curl -fsSL -o runtime "$RUNTIME_URL"
          echo "$APPIMAGETOOL_SHA256  appimagetool" | sha256sum -c -
          echo "$RUNTIME_SHA256  runtime" | sha256sum -c -
          chmod +x appimagetool
          echo "APPIMAGE_TOOLS=$RUNNER_TEMP/appimage" >> "$GITHUB_ENV"

      - name: Bundle
        run: |
          bash tools/bundle.sh --out dist-out --selftest "$SELFTEST_FIXTURE" \
            --appimagetool "$APPIMAGE_TOOLS/appimagetool" --runtime "$APPIMAGE_TOOLS/runtime"

      # The bundle as a person gets it: unpacked somewhere else, on a machine with no Rust (a cargo
      # that does not exist), compiling and running the self-test with the library beside kiln,
      # first from the tarball and then with the command line tool inside the AppImage.
      - name: Test the bundle
        run: |
          export CARGO=/does-not-exist/cargo
          unset KILN_RUNTIME_LIB
          where="$RUNNER_TEMP/bundle-check"
          mkdir -p "$where"
          tar -C "$where" -xzf dist-out/*.tar.gz
          root="$(ls -d "$where"/kiln-*)"
          ls -la "$root"
          "$root/selftest.sh"
          "$root/setup-toolchain.sh" --dry
          appimage="$(ls dist-out/*.AppImage)"
          "$appimage" --appimage-extract-and-run kiln doctor
          rm -rf "$RUNNER_TEMP/appimage-out"
          "$appimage" --appimage-extract-and-run kiln build --exefs "$SELFTEST_FIXTURE/exefs" --out "$RUNNER_TEMP/appimage-out" --name selftest
          set +e
          "$RUNNER_TEMP/appimage-out/selftest"
          code=$?
          test "$code" = 55 || { echo "the program built by the AppImage exited with $code, not 55"; exit 1; }

      - name: The name of this build
        id: build
        env:
          SHA: ${{ github.sha }}
          RUN: ${{ github.run_number }}
        run: |
          short="${SHA:0:7}"
          echo "short=$short" >> "$GITHUB_OUTPUT"
          echo "tag=build-$RUN-$short" >> "$GITHUB_OUTPUT"

      # A pull request or a manual run keeps the files as an artifact for 30 days; a push to `main`
      # or a tag keeps them in the release.
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        with:
          name: kiln-linux-x86_64
          path: |
            dist-out/*.tar.gz
            dist-out/*.AppImage
            dist-out/SHA256SUMS-linux.txt
          if-no-files-found: error
          retention-days: 30

      # The same tag and release as the Windows bundle of this build: the files are added to it.
      - name: Add to the pre-release of this build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.build.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Build ${{ github.run_number }} (${{ steps.build.outputs.short }})
          files: |
            dist-out/*.tar.gz
            dist-out/*.AppImage
            dist-out/SHA256SUMS-linux.txt
          prerelease: true
          make_latest: "false"

      - name: Add to a tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-out/*.tar.gz
            dist-out/*.AppImage
            dist-out/SHA256SUMS-linux.txt
          generate_release_notes: true
