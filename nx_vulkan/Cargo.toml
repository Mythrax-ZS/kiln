[package]
name = "nx_vulkan"
version = "0.1.0"
edition = "2021"
description = "Vulkan backend: runs the draws of the GPU model on a host GPU"
publish = false

[lib]
name = "nx_vulkan"
path = "src/lib.rs"

[features]
# Presenting frames in a window of its own (`NX_WINDOW=1` at run time).
window = ["dep:winit", "dep:ash-window", "dep:raw-window-handle"]
# Count the allocations of each thread (a counting global allocator), to measure what a hot path
# asks of the heap (`NX_TRACE_PERF`).
alloc_stats = []

[dependencies]
ash = { version = "0.38", default-features = false, features = ["loaded", "debug", "std"] }
nx_shader = { path = "../nx_shader" }
nx_gpu = { path = "../nx_gpu" }
winit = { version = "0.30", optional = true }
ash-window = { version = "0.13", optional = true }
raw-window-handle = { version = "0.6", optional = true }
