[package]
name = "recomp_gui"
version = "0.1.0"
edition = "2021"
description = "A desktop front end for recomp: pick a game, recompile it, run it and keep its settings"
publish = false

[[bin]]
name = "recomp-gui"
path = "src/main.rs"

[dependencies]
eframe = "0.36"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
